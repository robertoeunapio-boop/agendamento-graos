[tool.poetry]
name = "agendamento-graos"
version = "0.1.0"
description = "API de Agendamento de Grãos"
authors = ["Roberto Eunápio <roberto.euinapio@estudantes.ifg.edu.br>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = {extras = ["email"], version = "^2.13.5"}
sqlalchemy = "^2.0.52"
psycopg = {extras = ["binary"], version = "^3.3.5"}
python-dotenv = "^1.2.3"
bcrypt = "^5.0.0"
pyjwt = "^2.14.0"
python-multipart = "^0.0.32"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"